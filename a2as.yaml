agents:
  builtin_code_executor_agent:
    type: instance
    models: [BUILTIN_CODE_EXECUTOR_MODEL]
    params:
      name: BuiltinCodeExecutorAgent
      description: 专门使用 ADK 内置的 `BuiltInCodeExecutor` 在云端沙箱中执行 Python 代码片段。 此智能体用于标准的 Python 计算或简单的脚本执行，不能访问本地文件系统。 期望的输入是一个包含待执行
        Python 代码的字符串，智能体将返回代码的 stdout 或 stderr。
      code_executor: BuiltInCodeExecutor
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  calculator_logic_agent:
    type: instance
    models: [CALCULATOR_LOGIC_MODEL]
    tools: [evaluate_expression_tool, calculate_statistics_tool, unit_converter_tool, calculate_checksum_tool, newtons_method_tool]
    params:
      name: CalculatorLogicAgent
      description: |-
        专门执行数学和逻辑运算。接收一个包含任务描述和参数的 'request' 字符串。能够调用的工具包括：
        - `evaluate_mathematical_expression`: 安全地评估数学表达式字符串。需要参数: `expression` (str)。
        - `calculate_statistics`: 计算数值列表的统计数据。需要参数: `data` (List[float]), `stat_types` (List[str], e.g., ['mean', 'stdev'])。
        - `unit_converter`: 在不同单位之间转换数值。需要参数: `value` (float), `original_unit` (str), `target_unit` (str)。
        - `calculate_checksum`: 计算数字序列的校验和。需要参数: `number_sequence` (str), `algorithm` (str, e.g., 'isbn10', 默认为 'isbn10')。
        - `newtons_method_solver`: 使用牛顿法求解方程的根。需要参数: `function_str` (str, e.g., 'x**2 - 4'), `initial_guess` (float), 可选 `derivative_str` (str), `tolerance` (float), `max_iterations` (int)。协调器应确保 'request' 字符串清晰地包含要执行的操作类型以及所有必需的参数。
      instruction: ['- 对于 `evaluate_mathematical_expression`：`expression` 字符串。', '- 对于 `calculate_statistics`：一个 `data` 列表和一个
          `stat_types` 列表。', '- 对于 `unit_converter`：`value`、`original_unit` 和 `target_unit`。', '- 对于 `calculate_checksum`：`number_sequence`
          以及可选的 `algorithm`（默认为 ''isbn10''）。', '- 对于 `newtons_method_solver`：`function_str`、`initial_guess` 以及可选的 `derivative_str`、`tolerance`、`max_iterations`。',
        '- 确保用于 `calculate_statistics` 的数值列表已正确格式化为 Python 数字列表。', '- 对于 `evaluate_mathematical_expression`，确保表达式是该工具的有效字符串。',
        '4.  **返回结果：** 从工具的输出字典中返回 ''result''、''results''、''checksum_digit''、''root'' 或 ''message''。准确地传达任何错误消息。    如果工具返回一个包含
          ''status'': ''success'' 和一个结果字段（例如 ''result''、''results''、''checksum_digit''、''root''）的字典，    则返回该结果字段的值。如果状态是 ''error''，则返回
          ''message'' 字段。']
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  code_executor_agent:
    type: instance
    models: [CODE_EXECUTOR_MODEL]
    tools: [execute_local_python_tool]
    params:
      name: CodeExecutorAgent
      description: 专门在项目的工作目录内本地且安全地执行 Python 代码片段。 与 `BuiltinCodeExecutorAgent` 不同，此智能体执行的代码可以与本地项目环境交互（例如，读写项目内的文件，如果代码本身包含此类逻辑）。主要工具是
        `execute_local_python_code`，它需要一个名为 `code` (str) 的参数，包含要执行的 Python 代码。返回代码执行的 stdout 和 stderr。适用于需要本地环境交互或 `BuiltinCodeExecutorAgent`
        功能不足的 Python 代码执行场景。
      instruction: ['**工作流程：**', 2. 使用 `execute_local_python_code` 工具，将代码字符串作为 `code` 参数传递。]
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  document_processor_agent:
    type: instance
    models: [DOCUMENT_PROCESSOR_MODEL]
    tools: [read_text_tool, read_docx_tool, read_pptx_tool, process_pdf_tool]
    params:
      name: DocumentProcessorAgent
      description: |-
        专门负责读取、解析和理解多种格式的文档内容，包括 TXT, DOCX, PPTX, 和 PDF。 接收一个包含任务指令和文档绝对文件路径的 'request' 字符串。 根据文件类型选择合适的工具：
        - `read_text_file`: 读取纯文本文档 (.txt)。需要参数: `file_path` (str)。
        - `read_docx_file`: 读取 Word 文档 (.docx)。需要参数: `file_path` (str)。
        - `read_pptx_file`: 读取 PowerPoint 演示文稿 (.pptx)，提取文本内容。需要参数: `file_path` (str)。
        - `process_pdf_with_gemini`: 使用 Gemini API 处理 PDF 文档，可执行摘要、问答、信息提取等。需要参数: `file_path` (str), `prompt` (str, 描述对PDF的具体操作)。
        协调器应确保 'request' 字符串中包含清晰的操作指令（特别是对于 PDF）和正确的绝对文件路径。
      instruction: ['- 对于 `.pdf` 文件，使用 `process_pdf_with_gemini`，并将提取的操作/提示作为工具的 `prompt` 参数传递。', '- 对于 `.docx` 文件，使用 `read_docx_file`。',
        '- 对于 `.pptx` 文件，使用 `read_pptx_file`。', '- 对于 `.txt` 或其他纯文本文件，使用 `read_text_file`。', 4.  **返回结果：** 传递工具输出中的 'content'
          或 'message'。如果使用的工具是 `process_pdf_with_gemini`，其输出即为直接答案。]
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  filesystem_agent:
    type: instance
    models: [FILESYSTEM_AGENT_MODEL]
    tools: [read_file_tool, write_file_tool, list_dir_tool, get_abs_path_tool, get_rel_path_tool]
    params:
      name: FilesystemAgent
      description: |-
        专门与本地文件系统进行交互，但操作范围严格限制在项目的当前工作目录内。 接收一个包含任务描述和相关路径（通常是相对路径）的 'request' 字符串。 可用的工具包括：
        - `read_local_file`: 读取指定相对路径的文件内容。需要参数: `relative_path` (str)。
        - `write_local_file`: 将内容写入指定相对路径的文件。需要参数: `relative_path` (str), `content` (str)。可选参数: `overwrite` (bool, 默认为 False)。**此工具需谨慎使用，以防意外覆盖文件。**
        - `list_directory_contents`: 列出指定相对路径的目录内容。可选参数: `relative_path` (str, 默认为项目根目录)。
        - `get_absolute_path`: 将相对于项目根目录的路径转换为绝对路径。需要参数: `relative_path` (str)。
        - `get_relative_path`: 将项目内的绝对路径转换为相对于项目根目录的路径。需要参数: `absolute_path` (str)。
        所有工具操作的路径都必须是相对于项目根目录的，除非明确说明是处理绝对路径的工具。协调器在委派任务时必须提供清晰的路径信息。
      instruction: ['**可用工具：**', '- `read_local_file`：读取文件内容。需要 `relative_path`（相对路径）参数。', '- `write_local_file`：将内容写入文件。需要
          `relative_path` 和 `content`（内容）参数。可选 `overwrite`（覆盖，默认为 False）参数。**请极其谨慎使用此工具。**', '- `list_directory_contents`：列出目录中的文件和子目录。可选
          `relative_path` 参数（默认为项目根目录）。', '- `get_absolute_path`：将相对路径转换为绝对路径。需要 `relative_path` 参数。', '**工作流程：**', 2. 解析
          `request` 以识别正确的工具及其参数（例如，`relative_path`、`content`、`overwrite`、`absolute_path`）。除非使用 `get_relative_path`，否则提供的所有路径都必须是相对于项目根目录的相对路径。,
        4. 从工具的结果字典中返回相关信息（例如，'content'、'message'、'contents'、'absolute_path'、'relative_path'）。]
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  google_search_agent:
    type: instance
    models: [GOOGLE_SEARCH_MODEL]
    tools: [google_search]
    params:
      name: GoogleSearchAgent
      description: 专门执行 Google 网页搜索。接收一个包含搜索关键词的 'request' 字符串 (该字符串将作为搜索查询)。使用 ADK 内置的 `google_search` 工具来获取搜索结果。适用于需要获取一般知识、查找当前事件信息或任何需要直接进行网络搜索的场景。此智能体只负责执行搜索并返回原始搜索结果（通常是摘要或片段列表），不进行深度分析或内容提取。如果需要从特定网页提取详细内容，应使用
        `WebResearcherAgent`。
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  multimodal_processor_agent:
    type: instance
    models: [MULTIMODAL_PROCESSOR_MODEL]
    tools: [process_audio_tool, process_image_tool]
    params:
      name: MultimodalProcessorAgent
      description: |-
        专门处理和理解图像（如 PNG, JPG, JPEG, WEBP, HEIC, HEIF）和音频（如 MP3, WAV, AAC, OGG, FLAC）文件，利用 Gemini 的高级多模态AI能力。接收一个包含具体操作指令和文件绝对路径的 'request' 字符串。能够调用的工具包括：
        - `process_image_with_gemini`: 处理图像文件。需要参数: `file_path` (str, 图像文件的绝对路径), `prompt` (str, 对图像的操作指令，例如 '描述这张图片', '识别图中的物体', '图中的文字是什么？')。
        - `process_audio_with_gemini`: 处理音频文件。需要参数: `file_path` (str, 音频文件的绝对路径), `prompt` (str, 对音频的操作指令，例如 '转录此音频', '总结这段音频的主要内容', '这段音频的情绪是怎样的？')。
        协调器必须在 'request' 中提供清晰的指令和正确的绝对文件路径。智能体将根据文件类型选择合适的工具，并将指令作为 'prompt' 参数传递给相应的 Gemini 处理函数。
      instruction: ['- 对于图像文件（.png, .jpg, .jpeg, .webp, .heic, .heif），使用 `process_image_with_gemini`。', '- 对于音频文件（.mp3, .wav,
          .aac, .ogg, .flac），使用 `process_audio_with_gemini`。']
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  orchestrator_agent.0:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: DummyAgent
      instruction: [Error loading real agent.]
      instance: orchestrator_agent
  orchestrator_agent.1:
    type: instance
    models: [ORCHESTRATOR_MODEL]
    tools: [google_search_tool, builtin_code_executor_tool, web_researcher_tool, code_executor_tool, document_processor_tool,
      spreadsheet_data_tool, multimodal_processor_tool, specialized_file_tool, calculator_logic_tool, filesystem_tool]
    params:
      name: GAIAOrchestratorAgent
      description: GAIA任务的主要协调智能体。理解请求、计划执行、提取参数（包括绝对文件路径），并委托给专门的智能体。
      instruction: ['**流程：**', '*   **可用工具：** `GoogleSearchAgent`, `BuiltinCodeExecutorAgent`, `WebResearcherAgent`, `DocumentProcessorAgent`,
          `SpreadsheetDataAgent`, `MultimodalProcessorAgent`, `SpecializedFileAgent`, `CalculatorLogicAgent`, `FilesystemAgent`,
          `CodeExecutorAgent`。', '- **当** `BuiltinCodeExecutorAgent` 的能力不足（环境包缺失或没有返回预期结果），可尝试使用 `CodeExecutorAgent`。', '```json',
        '{', '"FINAL_ANSWER": "42",', '}', '```', '```json', '{', '"FINAL_ANSWER": "[Agent could not determine the answer]",',
        '}', '```']
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
      instance: orchestrator_agent
  specialized_file_agent:
    type: instance
    models: [SPECIALIZED_FILE_AGENT_MODEL]
    tools: [parse_pdb_tool, extract_zip_tool, read_json_tool]
    params:
      name: SpecializedFileAgent
      description: |-
        专门处理特定的文件格式，包括 PDB (Protein Data Bank), ZIP 压缩包, 以及结构化的 JSON, JSONL, JSONLD 文件。接收一个包含操作指令和文件绝对路径的 'request' 字符串。根据文件类型和指令选择合适的工具：
        - `parse_pdb_file`: 解析 PDB 文件并返回结构摘要或回答关于PDB文件的特定查询。需要参数: `file_path` (str, PDB文件的绝对路径)。工具的 prompt/query 参数用于传递特定查询（例如 '计算原子间距离'）。
        - `extract_zip_content`: 列出 ZIP 压缩包的内容，或提取压缩包内特定文件的文本内容。需要参数: `file_path` (str, ZIP文件的绝对路径)。可选参数: `target_filename` (str, 要提取的内部文件名)。如果未提供 `target_filename`，则列出内容。
        - `read_json_file`: 读取并解析 JSON, JSONL, 或 JSONLD 文件，返回其内容。需要参数: `file_path` (str, 文件的绝对路径)。
        协调器应确保 'request' 字符串中包含清晰的操作指令（如对PDB的特定查询、ZIP中要提取的文件名）和正确的绝对文件路径。
      instruction: ['- 对于 `.pdb` 文件，使用 `parse_pdb_file`。将任何提取的查询作为 `query` 参数传递。', '- 对于 `.zip` 文件，使用 `extract_zip_content`。传递任何提取的
          `target_filename`。', '- 对于 `.json`、`.jsonl`、`.jsonld` 文件，使用 `read_json_file`。', 4.  **返回结果：** 传递工具输出中的 'content'
          或 'message'。]
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  spreadsheet_data_agent:
    type: instance
    models: [SPREADSHEET_AGENT_MODEL]
    tools: [get_info_tool, get_sheets_tool, get_cell_tool, query_tool, calculate_stat_tool]
    params:
      name: SpreadsheetDataAgent
      description: |-
        专门用于读取、分析和查询电子表格文件（如 Excel .xlsx, .xls 和 CSV .csv）中的数据。 接收一个包含任务指令和电子表格绝对文件路径的 'request' 字符串。 根据指令解析并调用以下工具之一：
        - `get_spreadsheet_info`: 提供电子表格的元数据（如形状、列名、数据类型、基本统计、样本行）。需要参数: `file_path` (str, 绝对路径)。可选参数: `sheet_name` (str, 工作表名称或索引)。
        - `get_sheet_names`: 列出 Excel 文件中的所有工作表名称。需要参数: `file_path` (str, 绝对路径)。仅适用于 Excel 文件。
        - `get_cell_value`: 获取指定单元格的值。需要参数: `file_path` (str, 绝对路径), `cell_coordinate` (str, 例如 'B5' 或 'Sheet1!B5')。可选参数: `sheet_name` (str, 如果未在 cell_coordinate 中指定)。
        - `query_spreadsheet`: 使用 Pandas 查询字符串筛选电子表格中的数据。需要参数: `file_path` (str, 绝对路径), `query_string` (str, 例如 "`列名 A` > 10 and `列名 B` == 'some_value'")。可选参数: `sheet_name` (str)。
        - `calculate_column_stat`: 计算指定列的统计数据。需要参数: `file_path` (str, 绝对路径), `column_name` (str), `stat_type` (str, 例如 'sum', 'mean', 'median', 'std', 'count')。可选参数: `sheet_name` (str)。
        协调器应确保 'request' 字符串清晰地指明要执行的操作以及所有必需的参数，包括正确的绝对文件路径和任何工作表特定信息。
      instruction: ['**可用工具：**', '- `get_spreadsheet_info`：提供元数据（形状、列、类型、统计信息、样本行）。需要 `file_path`，可选 `sheet_name`。', '- `get_sheet_names`：列出
          Excel 文件中的所有工作表名称。需要 `file_path`。', '- `get_cell_value`：获取单个单元格的值。需要 `file_path`、`cell_coordinate`，可选 `sheet_name`。',
        '- `query_spreadsheet`：使用 pandas 查询字符串筛选数据。需要 `file_path`、`query_string`，可选 `sheet_name`。', '- `calculate_column_stat`：计算列的统计数据。需要
          `file_path`、`column_name`、`stat_type`（例如，''sum''、''mean''、''std''），可选 `sheet_name`。', '**工作流程：**', 3.  **返回结果：**
          传递工具输出字典中的相关信息（例如，'info'、'sheet_names'、'value'、'filtered_data'、'result'）。如果状态为 'error'，则返回 'message'。]
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback
  web_researcher_agent:
    type: instance
    models: [WEB_RESEARCHER_MODEL]
    tools: [fetch_static_page_tool, interact_dynamic_page_tool, search_arxiv_tool, get_arxiv_details_tool, fetch_wikipedia_tool,
      inspect_github_tool, get_wayback_snapshot_tool]
    params:
      name: WebResearcherAgent
      description: |-
        专门执行高级网络研究和交互任务，不执行通用的 Google 搜索。接收一个包含任务指令和必要参数的 'query' (或 'request') 字符串。能够调用的工具包括：
        - `fetch_webpage_content`: 获取指定 URL 的静态文本内容。需要参数: `url` (str)。可选参数: `use_readability` (bool, 默认 True 获取清理后的 Markdown, False 获取原始 HTML)。
        - `interact_with_dynamic_page`: 与需要 JavaScript 交互的动态网页进行交互（如点击、填表）。需要参数: `url` (str), `actions` (List[Dict], 定义交互步骤)。
        - `search_arxiv`: 在 arXiv.org 上搜索科研论文。需要参数: `query` (str)。可选参数: `max_results` (int), `sort_by` (str), `sort_order` (str)。
        - `get_arxiv_paper_details`: 获取特定 arXiv 论文的详细信息（摘要、元数据）。需要参数: `paper_id` (str)。
        - `fetch_wikipedia_article`: 获取维基百科文章的摘要或内容。需要参数: `title` (str)。可选参数: `lang` (str, 默认 'en')。
        - `inspect_github`: 执行 GitHub 相关操作，如获取仓库信息、文件内容、议题列表/详情。需要参数: `request_details` (str, 包含 action, owner, repo, path 等键值对)。
        - `get_wayback_machine_snapshot`: 从互联网档案库 (Wayback Machine) 检索网页快照。需要参数: `url` (str)。可选参数: `timestamp` (str, YYYYMMDDhhmmss格式)。
        协调器应确保 'query' (或 'request') 字符串清晰地描述任务，并为所选工具提供所有必需的参数（如 URL、搜索词、操作指令、文件路径等）。
      instruction: ['**可用工具：**', '- `fetch_webpage_content`：用于获取特定 URL 的文本内容。设置 `use_readability=True`（默认）以获取清理后的 Markdown，设置为
          `False` 以获取原始 HTML。', '- `interact_with_dynamic_page`：**仅**用于需要点击、表单填写等操作的重度 JavaScript 页面。需要 `url` 和 `actions`
          列表参数。', '- `search_arxiv`：用于在 arXiv.org 上搜索论文。需要 `query` 参数。', '- `get_arxiv_paper_details`：用于通过 `paper_id` 获取 arXiv
          论文的摘要/元数据。', '- `fetch_wikipedia_article`：用于通过 `title`（以及可选的 `lang`）获取维基百科文章的摘要。', '- `inspect_github`：用于执行 GitHub
          相关任务。需要 `request_details` 字符串参数（例如：''action: get_file, owner: google, repo: adk, path: README.md''）。', '- `get_wayback_machine_snapshot`：用于通过
          `url`（以及可选的 `timestamp`）检索已归档的网页快照。', '**工作流程：**']
      before_model_callback: adk_before_model_callback
      after_model_callback: adk_after_model_callback

