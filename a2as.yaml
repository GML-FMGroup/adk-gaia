variables:
  GITHUB_PERSONAL_ACCESS_TOKEN:
    type: env
    params:
      caller: [os.getenv]
      path: [dotenv_path]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv]
      path: [dotenv_path]

files:
  "..":
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", ".."]
  .env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), "..", .env]
  .py:
    type: literal
    actions: [write]
    params:
      caller: [tempfile.NamedTemporaryFile]
      mode: w+
      delete: "False"
      dir: PROJECT_ROOT
      encoding: utf-8
  absolute_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  config.json:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [project_root, config.json]
  CONFIG_PATH:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open, json.load]
  DEBUG_LOG_DIR:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, os.makedirs]
  DEBUG_LOG_DIR_NAME:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [GAIA_BASE_DIR, DEBUG_LOG_DIR_NAME]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load, Path]
      alias: [f]
  log_filepath:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.exists, open, os.rename]
  path:
    type: literal
    actions: [read]
    params:
      caller: [Path(file_path)]
  rel_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [project_root, rel_path]
  resolved_abs_path:
    type: variable
    actions: [read]
    params:
      caller: [Path.resolve()]
  safe_path:
    type: variable
    actions: [read, write]
    params:
      caller: [safe_path.read_text, safe_path.parent.mkdir, safe_path.write_text, safe_path.iterdir]
  temp_script_path:
    type: variable
    actions: [delete, read]
    params:
      caller: [os.remove, os.path.exists]

processes:
  python:
    type: shell
    actions: [exec]
    args: [[temp_script_path]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
      ref: sys.executable
